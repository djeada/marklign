[package]
name = "marklign"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Markdown formatter with conservative LaTeX math support"
license = "MIT"
repository = "https://github.com/djeada/marklign"
readme = "README.md"
keywords = ["markdown", "formatter", "latex", "math", "cli"]
categories = ["command-line-utilities", "text-processing"]
exclude = ["/.github"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
# Only the parser and the CommonMark writer are needed. The default features
# add Comrak's own CLI and syntect with the Oniguruma C library, which would
# make every build depend on a C toolchain.
comrak = { version = "0.55", default-features = false }

[profile.release]
codegen-units = 1
lto = true
strip = true
