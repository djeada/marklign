name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test Markdown environment integration
        run: cargo test --test environment_integration -- --nocapture
      - name: Run tests
        run: cargo test --all-targets
      - name: Smoke-test CLI
        shell: bash
        run: |
          printf '## PDEs\n\n$$\nu=g\n$$\n' > /tmp/marklign-smoke.md
          cargo run -- /tmp/marklign-smoke.md --write
          cargo run -- /tmp/marklign-smoke.md --check
          grep -q 'u = g' /tmp/marklign-smoke.md
