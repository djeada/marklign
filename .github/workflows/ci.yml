name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --all-targets
      - name: Smoke-test the CLI
        shell: bash
        run: |
          set -euo pipefail
          # An isolated `=` line is a setext heading underline to a Markdown
          # block parser; the equation must survive it.
          printf '## PDEs\n\n$$\nu\n=\ng\n$$\n' > smoke.md
          cargo run --quiet -- smoke.md --write
          cargo run --quiet -- smoke.md --check
          grep -qx 'u = g' smoke.md
          grep -qx '## PDEs' smoke.md
          printf '$$\na\n+\nb\n$$\n' | cargo run --quiet -- - | grep -qx 'a + b'
          # The README documents the formatter's own output, so it must be a
          # fixed point. examples/ is deliberately unformatted input.
          cargo run --quiet -- README.md --check

  msrv:
    name: Build with the declared minimum Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
